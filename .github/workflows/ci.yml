name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - '.github/**'
      - '!.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Light checks grouped together to save setup time (pnpm install overhead)
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Audit
        continue-on-error: true
        run: pnpm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Collect coverage
        run: pnpm test:coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: .
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate version
        run: pnpm version:gen
      - name: Build shared package
        run: pnpm --filter @yotara/shared build
      - name: Start API
        run: |
          RATE_LIMIT_MAX=10000 EMAIL_RATE_IP_CAP=100 E2E_API_LOG="$GITHUB_WORKSPACE/api-e2e.log" pnpm --filter @yotara/api dev > api-e2e.log 2>&1 &
          echo $! > api.pid
          pnpm --filter @yotara/frontend e2e:wait --timeout 60000 http-get://localhost:3000/health
      - name: Start Frontend
        run: |
          pnpm --filter @yotara/frontend dev > frontend-e2e.log 2>&1 &
          echo $! > frontend.pid
          pnpm --filter @yotara/frontend e2e:wait --timeout 60000 http-get://localhost:4200
      - name: Install Playwright browsers
        run: pnpm --filter @yotara/frontend exec playwright install chromium
      - name: Run E2E tests
        run: pnpm --filter @yotara/frontend e2e
        env:
          CI: true
          E2E_API_LOG: ${{ github.workspace }}/api-e2e.log
          E2E_API_URL: http://localhost:3000
          E2E_BASE_URL: http://localhost:4200
      - name: Upload E2E diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-diagnostics
          path: |
            apps/frontend/e2e/playwright-report/
            apps/frontend/e2e/test-results/
            api-e2e.log
            frontend-e2e.log
          if-no-files-found: ignore
      - name: Stop E2E services
        if: always()
        run: |
          if [ -f api.pid ]; then kill "$(cat api.pid)" 2>/dev/null || true; fi
          if [ -f frontend.pid ]; then kill "$(cat frontend.pid)" 2>/dev/null || true; fi
          pkill -f 'tsx watch src/server.ts' 2>/dev/null || true
          pkill -f 'ng serve --port 4200' 2>/dev/null || true

  docker-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Create docker-compose.ci.yml
        run: |
          cat <<EOF > docker-compose.ci.yml
          services:
            api:
              image: yotara-api:latest
              build: !reset
            frontend:
              image: yotara-frontend:latest
              build: !reset
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # We build with Buildx to leverage GHA caching
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: yotara-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile
          load: true
          tags: yotara-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # To use the pre-built images with docker-compose, we can use an override
      # or just rely on the fact that they are already tagged.
      # However, docker-compose.yml has 'build' sections.
      # If we run 'docker-compose up -d', it might try to rebuild.
      # We can create a temporary override to point to the images we just built.

      - name: Install pnpm (for smoke test scripts)
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'

      - name: Run Smoke Test
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
          # Wait for services to be ready is handled inside the smoke script, 
          # but we give them a small head start.
          sleep 5
          pnpm smoke:docker
        env:
          DOCKER_SMOKE_BASE_URL: http://localhost:8080
          BETTER_AUTH_SECRET: 903d44f75ea956577ae15335bbbef8532a867cdeae599cccac72357d40f14214
          # The API refuses to boot with NODE_ENV=production and no key
          # (fail-loud contract); this canonical test key is not used for
          # production signing.
          RESEND_API_KEY: ci-fake-key-for-boot-only

      - name: Logs on failure
        if: failure()
        run: |
          if [ -f docker-compose.ci.yml ]; then
            docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
          else
            docker compose -f docker-compose.yml logs
          fi
        env:
          BETTER_AUTH_SECRET: 903d44f75ea956577ae15335bbbef8532a867cdeae599cccac72357d40f14214

      - name: Tear down stack
        # Always run so containers never leak past the job, even on failure.
        if: always()
        run: |
          if [ -f docker-compose.ci.yml ]; then
            docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
          else
            docker compose -f docker-compose.yml down -v
          fi
        env:
          BETTER_AUTH_SECRET: 903d44f75ea956577ae15335bbbef8532a867cdeae599cccac72357d40f14214

  docker-api-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up QEMU
        if: false # native runners — no emulation (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: yotara-api:${{ matrix.architecture }}
          cache-from: type=gha,scope=api-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.architecture }}

      - name: Create API Compose override
        # The native smoke signs up and creates a task, which requires a
        # session. Production sign-up is email-first (no session until the
        # email is verified), so the smoke runs the API in dev mode — the
        # deliberate double opt-in for test instances. The production boot
        # guard (fail-loud on secret/email config) is covered by the host-level
        # docker-and-smoke job, which runs without dev mode.
        run: |
          cat > docker-compose.api-ci.yml <<'EOF'
          services:
            api:
              image: yotara-api:${{ matrix.architecture }}
              build: !reset
              ports:
                - "3000:3000"
              environment:
                APP_BASE_URL: http://localhost:3000
                TRUSTED_ORIGINS: http://localhost:3000
                DEV_MODE: "true"
                ALLOW_DEV_MODE_IN_PRODUCTION: "true"
          EOF

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Run API native and database smoke test
        # No RESEND_API_KEY here: dev mode deliberately ignores it and logs
        # emails to the console instead, so this job also proves the API boots
        # the dev-mode stack without any email provider configured.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.api-ci.yml up -d api
          pnpm smoke:docker:api
        env:
          BETTER_AUTH_SECRET: 903d44f75ea956577ae15335bbbef8532a867cdeae599cccac72357d40f14214
          DOCKER_SMOKE_COMPOSE_FILES: -f docker-compose.yml -f docker-compose.api-ci.yml
          DOCKER_SMOKE_SERVICE: api

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.api-ci.yml logs api
        env:
          BETTER_AUTH_SECRET: 903d44f75ea956577ae15335bbbef8532a867cdeae599cccac72357d40f14214

      - name: Stop API containers
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.api-ci.yml down -v
        env:
          BETTER_AUTH_SECRET: 903d44f75ea956577ae15335bbbef8532a867cdeae599cccac72357d40f14214
