name: Docs Consistency

# `ci.yml` ignores changes limited to `**.md` and `docs/**`, which means a
# docs-only pull request would never run a documentation check. This workflow
# exists to cover exactly that gap, so it deliberately has no paths-ignore.
#
# It needs no dependencies: the check uses Node builtins only.

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '**.md'
      - 'apps/api/.env.example'
      - 'scripts/check-env-docs.mjs'
      - 'scripts/check-docs-index.mjs'
      - '.github/workflows/docs-consistency.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '**.md'
      - 'apps/api/.env.example'
      - 'scripts/check-env-docs.mjs'
      - 'scripts/check-docs-index.mjs'

permissions:
  contents: read

jobs:
  env-docs:
    name: Environment variables are documented
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
      - name: Check docs/CONFIGURATION.md covers apps/api/.env.example
        run: node scripts/check-env-docs.mjs
      - name: Check docs/README.md indexes every tracked document
        run: node scripts/check-docs-index.mjs
