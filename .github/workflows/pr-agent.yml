name: PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  # Primary reviewer. Both models are served by OpenRouter, so one api_base
  # covers them and config.fallback_models can do the failover in-process.
  review_primary:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@v0.48.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          openrouter__key: ${{ secrets.OPENROUTER_REVIEW_KEY }}
          config.model: 'openrouter/dots-studio/dots-3-note-preview:free'
          # Required, not optional. get_max_tokens() raises unless the model is
          # in pr_agent/algo/__init__.py's MAX_TOKENS table or this is positive,
          # and max_model_tokens caps whatever this resolves to.
          config.custom_model_max_tokens: '512000'
          config.max_model_tokens: '262144'
          # Fail over in-process to the backup model if the primary request fails.
          config.fallback_models: '["openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"]'
          # Dots is reasoning-capable. Without this it can spend the whole output
          # budget on reasoning and return empty content with finish_reason=length.
          openrouter.reasoning_effort: 'none'
          # pr-agent defaults to 2 minutes, and LiteLLM retries a timed-out call
          # internally, so every request was failing after three attempts while
          # the model was still working.
          config.ai_timeout: '900'
          # Without this, pr-agent swallows a failed model call, comments
          # "Failed to generate code suggestions for PR" and still exits 0, so
          # the job shows green and the backup job never runs.
          config.propagate_tool_errors: 'true'
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'true'
          github_action_config.auto_improve: 'true'
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review", "review_requested"]'

  # Last resort if the primary job fails outright, for reasons an in-process
  # fallback cannot cover: the action crashing, bad credentials, or a provider
  # outage that takes the primary model with it.
  review_backup:
    needs: review_primary
    if: ${{ failure() && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@v0.48.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          openrouter__key: ${{ secrets.OPENROUTER_REVIEW_KEY }}
          config.model: 'openrouter/nvidia/nemotron-3-ultra-550b-a55b:free'
          # Same reason as the primary job: without a positive value the action
          # throws before it reviews anything. This model reports 1,000,000.
          config.custom_model_max_tokens: '1000000'
          config.max_model_tokens: '262144'
          config.fallback_models: '[]'
          # Keep the completion budget for the review itself; a reasoning-only
          # response is indistinguishable from an empty one to pr-agent.
          openrouter.reasoning_effort: 'none'
          config.ai_timeout: '900'
          config.propagate_tool_errors: 'true'
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'true'
          github_action_config.auto_improve: 'true'
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review", "review_requested"]'
