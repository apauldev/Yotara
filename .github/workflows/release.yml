name: Release

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Do not cancel releases

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      release_sha: ${{ steps.get_version.outputs.release_sha }}
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):') &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(deploy):'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Git configuration
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Release
        run: pnpm release

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push changes
        run: git push --follow-tags origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ${{ matrix.runner }}
    needs: release
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):') &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(deploy):'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            GIT_HASH=${{ needs.release.outputs.release_sha }}
            GIT_BRANCH=main
          tags: |
            apauldev2/yotara-api:${{ needs.release.outputs.version }}-${{ matrix.architecture }}
            apauldev2/yotara-api:v${{ needs.release.outputs.version }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=release-api-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=release-api-${{ matrix.architecture }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            GIT_HASH=${{ needs.release.outputs.release_sha }}
            GIT_BRANCH=main
          tags: |
            apauldev2/yotara-frontend:${{ needs.release.outputs.version }}-${{ matrix.architecture }}
            apauldev2/yotara-frontend:v${{ needs.release.outputs.version }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=release-frontend-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=release-frontend-${{ matrix.architecture }}

  docker-manifest:
    runs-on: ubuntu-latest
    needs: [release, docker-build]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):') &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(deploy):'))
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push API manifest
        run: |
          docker buildx imagetools create -t apauldev2/yotara-api:${{ needs.release.outputs.version }} \
            -t apauldev2/yotara-api:v${{ needs.release.outputs.version }} \
            -t apauldev2/yotara-api:latest \
            apauldev2/yotara-api:${{ needs.release.outputs.version }}-amd64 \
            apauldev2/yotara-api:${{ needs.release.outputs.version }}-arm64

      - name: Create and push Frontend manifest
        run: |
          docker buildx imagetools create -t apauldev2/yotara-frontend:${{ needs.release.outputs.version }} \
            -t apauldev2/yotara-frontend:v${{ needs.release.outputs.version }} \
            -t apauldev2/yotara-frontend:latest \
            apauldev2/yotara-frontend:${{ needs.release.outputs.version }}-amd64 \
            apauldev2/yotara-frontend:${{ needs.release.outputs.version }}-arm64
