@if (statusService.isLoading()) {
  <div class="loading-bar" role="progressbar" aria-label="Loading content" @loadingBar></div>
}

<div class="toast-container" aria-live="polite">
  @for (toast of statusService.toasts(); track toast.id) {
    <div
      class="toast toast-{{ toast.type }}"
      [class.toast-actionable]="toast.action"
      [class.toast-reduced-motion]="reducedMotion"
      role="status"
      @toastAnimation
      (@toastAnimation.done)="onToastAnimationDone(toast.id, $event)"
      (mouseenter)="enterToast(toast.id)"
      (mouseleave)="leaveToast(toast.id)"
      (focusin)="focusToast(toast.id)"
      (focusout)="blurToast(toast.id, $event)"
    >
      <span class="toast-icon">
        @switch (toast.type) {
          @case ('success') {
            <fa-icon [icon]="faCircleCheck"></fa-icon>
          }
          @case ('error') {
            <fa-icon [icon]="faCircleExclamation"></fa-icon>
          }
          @case ('warning') {
            <fa-icon [icon]="faCircleExclamation"></fa-icon>
          }
          @case ('info') {
            <fa-icon [icon]="faCircleInfo"></fa-icon>
          }
        }
      </span>

      <div class="toast-content">
        {{ toast.message }}
      </div>

      @if (toast.action; as action) {
        <button type="button" class="toast-action" (click)="runAction(toast)">
          {{ action.label }}
        </button>
      }

      @if (toast.dismissible) {
        <button
          type="button"
          class="toast-close"
          aria-label="Dismiss notification"
          (click)="statusService.remove(toast.id)"
        >
          <fa-icon [icon]="faXmark"></fa-icon>
        </button>
      }
    </div>
  }
</div>
