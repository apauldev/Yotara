<app-personal-task-workspace>
  <section class="cal-page">
    <app-page-header title="Calendar" />

    <app-calendar-header
      [monthLabel]="monthLabel()"
      [noDateCount]="noDateCount()"
      [noDateActive]="showNoDate()"
      [showDone]="showDone()"
      [showMetadata]="showMetadata()"
      (previous)="previousMonth()"
      (next)="nextMonth()"
      (newTask)="newTask()"
      (toggleNoDate)="toggleNoDate()"
      (toggleShowDone)="toggleShowDone()"
      (toggleShowMetadata)="toggleShowMetadata()"
    />

    @if (showInitialLoading()) {
      <div class="cal-loading" role="status" aria-live="polite">Loading your calendar…</div>
    } @else {
      <ng-template #calendarMain>
        <app-calendar-month-grid
          [cells]="cells()"
          [selectedKey]="selectedKey()"
          [completionOverrides]="completionOverrides()"
          [todayKey]="todayKey"
          [showMetadata]="showMetadata()"
          [showCheck]="!isMobile()"
          [allowDrag]="!isMobile()"
          [selectDayOnTaskTap]="isMobile()"
          [allowQuickCreate]="!isMobile()"
          (selectDate)="selectDate($event)"
          (openTask)="openTask($event)"
          (completeTask)="completeTask($event)"
          (rescheduleTask)="moveTask($event)"
          (createTask)="createTaskForDate($event)"
        />

        @if (!monthHasTasks()) {
          <p class="cal-month-empty">
            Nothing scheduled in {{ monthLabel() }} yet. Give a task a due date to see it here.
          </p>
        }
      </ng-template>

      <ng-template #sidePanel>
        @if (showNoDate()) {
          <app-calendar-no-date-list
            [tasks]="undatedTasks()"
            [accentByProject]="projectAccents()"
            [completionOverrides]="completionOverrides()"
            [todayKey]="todayKey"
            [projectNames]="projectNames()"
            [labelNames]="labelNames()"
            [showMetadata]="showMetadata()"
            [touchTargets]="isMobile()"
            (openTask)="openTask($event)"
            (completeTask)="completeTask($event)"
            (scheduleTask)="scheduleTask($event)"
          />
        } @else {
          <app-calendar-day-panel
            [dateLabel]="selectedDateLabel()"
            [tasks]="selectedDayTasks()"
            [accentByProject]="projectAccents()"
            [completionOverrides]="completionOverrides()"
            [todayKey]="todayKey"
            [projectNames]="projectNames()"
            [labelNames]="labelNames()"
            [showMetadata]="showMetadata()"
            [touchTargets]="isMobile()"
            (openTask)="openTask($event)"
            (completeTask)="completeTask($event)"
            (addTask)="addTaskForDate()"
          />
        }
      </ng-template>

      @if (isMobile()) {
        <ng-container [ngTemplateOutlet]="calendarMain" />

        @if (mobilePanelOpen()) {
          <div class="cal-sheet" role="dialog" aria-modal="true" aria-label="Day details">
            <header class="cal-sheet-head">
              <button type="button" class="cal-sheet-back" (click)="closeMobilePanel()">
                <fa-icon [icon]="faArrowLeft" aria-hidden="true" />
                Back
              </button>
            </header>
            <ng-container [ngTemplateOutlet]="sidePanel" />
          </div>
        }
      } @else {
        <div class="cal-layout">
          <div class="cal-main">
            <ng-container [ngTemplateOutlet]="calendarMain" />
          </div>

          <aside class="cal-side">
            <ng-container [ngTemplateOutlet]="sidePanel" />
          </aside>
        </div>
      }
    }
  </section>
</app-personal-task-workspace>
