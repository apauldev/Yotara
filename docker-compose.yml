services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # The API runs with `trustProxy: 1` and keys rate-limiting + login lockout
      # off request.ip, which it derives from X-Forwarded-For. It MUST be fronted
      # by a trusted proxy (nginx, per docker/nginx.conf) that sets/overwrites
      # X-Forwarded-For with the real client IP. Running the API bare or behind a
      # proxy that only appends makes request.ip attacker-controllable and defeats
      # both per-IP lockout and IP rate limiting.
      DATABASE_URL: ${DATABASE_URL:-./apps/api/data/yotara.db}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080/api}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-dev-secret-change-me}
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
    volumes:
      - yotara_api_data:/app/apps/api/data

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  yotara_api_data:
