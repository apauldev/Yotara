      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 13 15" to="360 13 15" dur="7s" repeatCount="indefinite"/>
        <use xlink:href="#leaf" width="26" height="30"/>
      </g>
    </g>
  </g>
  <g opacity="0.6">
    <g>
      <animateTransform attributeName="transform" type="translate" values="720,-30; 740,290" dur="11s" begin="-5s" repeatCount="indefinite"/>
      <g>
