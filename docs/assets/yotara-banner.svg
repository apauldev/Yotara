<svg width="854" height="240" viewBox="0 0 854 240" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Yotara">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="854" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173F35"/>
      <stop offset="0.5" stop-color="#3E7B63"/>
      <stop offset="1" stop-color="#B7D3C3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F7F6F2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F7F6F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafFill" x1="112" y1="92" x2="400" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9FE0B4"/>
      <stop offset="1" stop-color="#2F8F5B"/>
    </linearGradient>
    <symbol id="leaf" viewBox="140 125 250 285">
      <path d="M381.686 131C304.109 131 189.593 160.129 144.907 262.949C122.9 313.575 130.344 369.567 173.345 400C271.242 381.207 352.497 302.932 381.686 131Z" fill="url(#leafFill)"/>
      <path d="M329.593 169.335C331.997 175.011 329.348 181.568 323.673 183.972C261.259 210.416 223.724 254.904 202.882 322.471C201.05 328.411 194.752 331.741 188.811 329.909C182.87 328.078 179.541 321.779 181.372 315.839C204.253 241.668 245.774 192.901 314.956 163.414C320.632 161.01 327.188 163.659 329.593 169.335Z" fill="#EAF8EE" fill-opacity="0.55"/>
