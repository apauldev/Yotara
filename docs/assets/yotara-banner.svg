  <!-- wordmark + tagline -->
  <text x="427" y="128" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="1" fill="#F7F6F2">Yotara</text>
  <text x="427" y="166" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#F7F6F2" fill-opacity="0.85">Flow through your day, naturally.</text>
