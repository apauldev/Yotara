server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers. `always` applies them to error responses too.
  # HSTS is intentionally omitted: this compose setup terminates plain HTTP at
  # nginx. Enable `Strict-Transport-Security: max-age=31536000; includeSubDomains;
  # preload` once nginx terminates TLS (HTTPS) in front of the API.
  # The CSP value is injected from the $CONTENT_SECURITY_POLICY env var (set at
  # container start from the API's single source of truth) via envsubst.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "$CONTENT_SECURITY_POLICY" always;

  # Compression. Cloudflare also compresses, but the origin must not depend on
  # it: self-hosters without a CDN otherwise serve multi-hundred-KB JS bundles
  # uncompressed.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript
    text/xml application/xml image/svg+xml font/woff font/woff2;

  # Content-hashed build output (Angular outputHashing: all) is immutable.
  # favicon.ico has no hash in its name, so it gets its own shorter cache
  # below; everything else here is renamed on every build.
  # Must not be inherited by index.html below, hence no add_header at server level.
  location ~* \.(?:js|mjs|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|map)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "$CONTENT_SECURITY_POLICY" always;
    try_files $uri =404;
  }

  # The SPA entry point must revalidate every time so a deploy immediately
  # serves HTML referencing the freshly hashed assets.
  #
  # favicon.ico is unhashed and referenced by exact name, so it gets a short
  # cache in its own location below instead of the year-long one above.
  # Both locations repeat the security headers: defining add_header inside a
  # location disables inheritance of the server-level ones.
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "$CONTENT_SECURITY_POLICY" always;
  }

  location ~* ^[^?]*\.ico$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "$CONTENT_SECURITY_POLICY" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # ^~ on /api and /docs: regex locations below (the immutable-asset cache
  # rule) must never capture API or swagger asset paths — prefix matches here
  # win over all regex matching.
  location ^~ /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Swagger UI exposes the full API surface. Restrict to localhost + private LAN
  # ranges by default. Self-hosters who want remote API docs should put this
  # behind a reverse proxy with authentication rather than opening it publicly.
  location ^~ /docs {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    proxy_pass http://api:3000/docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /docs/ {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    proxy_pass http://api:3000/docs/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
